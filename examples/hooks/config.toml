# Merge this [hooks] section into your main config.toml; keep it disabled until ready.
# These paths assume Adam itself is the tool workspace. Use absolute paths elsewhere.
[hooks]
enabled = false
timeout_seconds = 5
max_input_bytes = 65536
max_output_bytes = 8192

[hooks.before_tool]
argv = [".venv/Scripts/python.exe", "examples/hooks/before_protect_directory.py", "vendor", "generated"]

[hooks.after_tool]
argv = [".venv/Scripts/python.exe", "examples/hooks/after_python_syntax.py"]
