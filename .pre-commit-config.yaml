repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format (check only)
        entry: .venv/Scripts/python.exe -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff lint (check only)
        entry: .venv/Scripts/python.exe -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pyright
        name: Pyright
        entry: .venv/Scripts/python.exe -m pyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
