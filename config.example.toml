[storage]
# Relative to this configuration file.
sessions_dir = "sessions"
# 独立记忆目录，相对当前配置文件；默认配置在 ADAM_HOME 下。
memories_dir = "memories"
# 文档索引缓存，可删除后从源文件重建。
documents_dir = "documents"
# 知识候选、审查与用户决定；这是持久记录，不能当文档缓存删除。
knowledge_dir = "knowledge"

[documents]
# 空数组不注册文档工具；如 ["docs"]，相对 --workspace（默认启动目录）。
# 此配置不授予额外读取权限；工作目录外的源还需 additional_read_dirs。
roots = []
top_k = 5
# semantic 需要 uv sync --extra documents 及显式 prepare-model；不会自动联网。
method = "keyword"
# hybrid 合并 BM25 与本地向量，仍需预先准备 embedding；keyword / semantic 可单独对照。
hybrid_candidates = 20
rrf_constant = 60
# 只在 hybrid 启用；正常查询只加载本地精排模型，失败明确回退到融合排序。
rerank = false
reranker_model = "BAAI/bge-reranker-v2-m3-int8"
rerank_candidates = 20
rerank_query_chars = 256
rerank_passage_chars = 512
# 仅增强关键词/向量评分文本，工具仍返回独立的原文引用；默认关闭。
contextualize = false
context_prefix_chars = 300
context_input_chars = 1200
embedding_model = "BAAI/bge-small-zh-v1.5"
semantic_min_score = 0.5
chunk_chars = 400
max_files = 200
max_file_bytes = 1048576
max_total_bytes = 10485760
max_scan_entries = 5000
max_chunks = 10000
scan_timeout_seconds = 10

[chat]
system_prompt = "你是 Adam，一个友好的编程助手。"

[agent]
max_model_requests = 8
max_tool_calls = 16
# 每轮专用编辑工具的尝试次数；参数错误和冲突也计数。
max_edit_attempts = 3
max_session_tokens = 50000
max_output_tokens = 4096

[no_progress]
# 同一轮内连续同名、同参数、同类失败；第二次提醒，第三次停止。
# 主任务与每个子任务独立计数，仍受 agent 总额度约束。
enabled = true
warn_after = 2
stop_after = 3

[subagents]
# 同一主会话并发运行的子 Agent 数量；不同终端分别限制。
max_concurrent = 2
# 一次主用户输入内最多新建多少个子 Agent，复用已有子 Agent 不计为新建。
max_created_per_turn = 4

[memory]
enabled = true
max_entries = 8
max_input_tokens = 1024
# semantic 复用本地已准备的模型；缺失或超限明确降级 keyword，不自动下载。
method = "keyword"
embedding_model = "BAAI/bge-small-zh-v1.5"
semantic_min_score = 0.5
max_semantic_records = 256

[reflection]
enabled = true
max_per_turn = 1
max_input_tokens = 4096
max_output_tokens = 1024

[planning]
enabled = true
max_steps = 8
max_replans = 3

[context]
# Application input budget, not the model's context window. Output is reserved separately.
max_input_tokens = 32768
# Estimated input + safety margin must fit within max_input_tokens.
safety_margin_tokens = 2048
# Recent turns remain verbatim; /compact summarizes older turns in one bounded request.
retain_recent_turns = 2
summary_max_output_tokens = 2048
# Shrink old tool results only when estimated input pressure reaches this ratio.
prune_tool_results = true
compression_trigger_ratio = 0.8
# At most one automatic summary per turn, counted against the model-request limit.
auto_compact = true
compression_target_ratio = 0.6
tool_prune_threshold_chars = 4000
tool_prune_head_chars = 1500
tool_prune_tail_chars = 500

[artifacts]
# 长工具结果存入 sessions_dir/_artifacts；模型按字符分页读取固定版本。
enabled = true
max_bytes = 1048576
max_session_bytes = 16777216
max_items = 128
max_read_chars = 4000

[hooks]
# Optional local before/after tool checks; see docs/lifecycle-hooks.md.
enabled = false
timeout_seconds = 5
max_input_bytes = 65536
max_output_bytes = 8192

[mcp]
# Explicitly enable only trusted local servers. See docs/mcp.md.
enabled = false
servers = []

[rules]
# Load scoped AGENTS.md before relevant tool execution.
enabled = true

[skills]
# Load project and user skills metadata; bodies are read on demand or with /skill.
enabled = true
# Relative to this config file (normally ~/.adam/skills), not the workspace.
user_dir = "skills"

[review]
# Independent read-only reviewer; shares subagent and token limits.
enabled = true
max_rounds = 2

[permissions]
# Additional user-approved directories; relative to this configuration file.
additional_read_dirs = []
# Separate write authorization; editing still requires approval of each diff.
additional_write_dirs = []

# Discover full schemas only when needed; full is available for controlled comparison.
# Discovery requests and calls consume the existing agent budgets.
[tool_discovery]
mode = "on_demand"

[tool_limits]
max_read_lines = 200
max_result_chars = 8000
max_scan_entries = 5000
max_text_file_bytes = 1048576
max_git_path_list_bytes = 1048576
# Cooperative directory scan timeout; blocking file IO is not interrupted.
scan_timeout_seconds = 5
# Timeout for each Git subprocess, not the entire multi-command query.
git_timeout_seconds = 5

# Default and maximum timeout for a user-approved command.
command_timeout_seconds = 30

[session_search]
# 默认只允许主 Agent 回查当前会话；额外 ID 明确授权读取同一 sessions_dir 下的旧对话。
# 子 Agent 不继承这份跨会话授权。最多 31 个不同短 ID；不要填文件路径。
enabled = true
allowed_session_ids = []
