[storage]
# Relative to this configuration file.
sessions_dir = "sessions"
# 独立记忆目录，相对当前配置文件；默认配置在 ADAM_HOME 下。
memories_dir = "memories"

[chat]
system_prompt = "你是 Adam，一个友好的编程助手。"

[agent]
max_model_requests = 8
max_tool_calls = 16
# 每轮专用编辑工具的尝试次数；参数错误和冲突也计数。
max_edit_attempts = 3
max_session_tokens = 50000
max_output_tokens = 4096

[subagents]
# 同一主会话并发运行的子 Agent 数量；不同终端分别限制。
max_concurrent = 2
# 一次主用户输入内最多新建多少个子 Agent，复用已有子 Agent 不计为新建。
max_created_per_turn = 4

[context]
# Application input budget, not the model's context window. Output is reserved separately.
max_input_tokens = 32768
# Estimated input + safety margin must fit within max_input_tokens.
safety_margin_tokens = 2048
# Recent turns remain verbatim; /compact summarizes older turns in one bounded request.
retain_recent_turns = 2
summary_max_output_tokens = 2048
# Shrink old tool results only when estimated input pressure reaches this ratio.
prune_tool_results = true
compression_trigger_ratio = 0.8
# At most one automatic summary per turn, counted against the model-request limit.
auto_compact = true
compression_target_ratio = 0.6
tool_prune_threshold_chars = 4000
tool_prune_head_chars = 1500
tool_prune_tail_chars = 500

[permissions]
# Additional user-approved directories; relative to this configuration file.
additional_read_dirs = []
# Separate write authorization; editing still requires approval of each diff.
additional_write_dirs = []

[tool_limits]
max_read_lines = 200
max_result_chars = 8000
max_scan_entries = 5000
max_text_file_bytes = 1048576
max_git_path_list_bytes = 1048576
# Cooperative directory scan timeout; blocking file IO is not interrupted.
scan_timeout_seconds = 5
# Timeout for each Git subprocess, not the entire multi-command query.
git_timeout_seconds = 5

# Default and maximum timeout for a user-approved command.
command_timeout_seconds = 30
